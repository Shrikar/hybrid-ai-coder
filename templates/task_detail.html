{{ define "task_detail" }}
<div class="task-detail">
  <div class="task-header">
    <h2>{{ .Task.Title }}</h2>
    <p>{{ .Task.Description }}</p>
  </div>

  <div class="task-info">
    <div class="info-item">
      <span class="label">Status:</span>
      <span class="value">{{ .Task.Status }}</span>
    </div>
    <div class="info-item">
      <span class="label">Created:</span>
      <span class="value">{{ .Task.CreatedAt }}</span>
    </div>
    <div class="info-item">
      <span class="label">Updated:</span>
      <span class="value">{{ .Task.UpdatedAt }}</span>
    </div>
  </div>

  <!-- Events Section -->
  <div class="collapsible-section">
    <button class="collapsible-header" hx-get="/tasks/{{ .Task.ID }}/events" hx-target="#events-content" hx-swap="innerHTML">
      Events
      <span class="toggle-icon">▼</span>
    </button>
    <div id="events-content" class="collapsible-content">
      <!-- Events will be loaded here -->
    </div>
  </div>

  <!-- Changed Files Section -->
  <div class="collapsible-section">
    <button class="collapsible-header" hx-get="/tasks/{{ .Task.ID }}/files" hx-target="#files-content" hx-swap="innerHTML">
      Changed Files
      <span class="toggle-icon">▼</span>
    </button>
    <div id="files-content" class="collapsible-content">
      <!-- Files will be loaded here -->
    </div>
  </div>

  <!-- Validation Summary Section -->
  <div class="collapsible-section">
    <button class="collapsible-header" hx-get="/tasks/{{ .Task.ID }}/validation" hx-target="#validation-content" hx-swap="innerHTML">
      Validation Summary
      <span class="toggle-icon">▼</span>
    </button>
    <div id="validation-content" class="collapsible-content">
      <!-- Validation will be loaded here -->
    </div>
  </div>
</div>
{{ end }}
