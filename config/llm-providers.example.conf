# Hybrid AI Coder - Multi LLM Provider Template
#
# This file is documentation/template only.
# Runtime uses config/config.json.
#
# Keep OPENAI + OLLAMA active for current project.

[active]
cloud_provider = openai
local_provider = ollama

[providers.openai]
enabled = true
provider = openai
model = gpt-5.3-codex
api_key_env = OPENAI_API_KEY
base_url = https://api.openai.com/v1
timeout = 90

[providers.ollama]
enabled = true
provider = ollama
model = qwen3-coder
base_url = http://localhost:11434
timeout = 90

